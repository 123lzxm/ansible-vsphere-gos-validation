---
# Description:
#   This case is to update the KEK and DB to 2023-signed which will expire by June 2026.
#
- name: windows_kek_db_update
  hosts: localhost
  gather_facts: no
  tasks:
    - name: "Test case block"
      block:
        - name: "Test setup"
          include_tasks: ../setup/test_setup.yml
          vars:
            create_current_test_folder: true

        - name: "Check and enable secure boot"
          include_tasks: enable_secureboot.yml

        - name: "Apply the KEK and DB updates"
          include_tasks: apply_kek_db_cert_updates.yml

        - name: "Revert the secure boot status"
          include_tasks: disable_secureboot.yml
          when: >-
            - secure_boot_changed is defined
            - secure_boot_changed

        - name: "Get guest OS version after updating KEK and DB"
          include_tasks: ../utils/win_get_os_version.yml

        - name: "Reset base snapshot after updating KEK and DB"
          include_tasks: ../../common/reset_base_snapshot.yml
          vars:
              remove_old_base_snapshot: true
              base_snapshot_description: "{{ win_os_version_build }}"
      rescue:
        - name: "Test case failure"
          include_tasks: ../../common/test_rescue.yml
          vars:
            exit_testing_when_fail: true