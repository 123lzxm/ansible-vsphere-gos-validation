---
# Description:
#   This case is to test the PK Capsule Update.
#   By installing pkupdatefw driver and the Windows Updates(2026.7B and later), 
#   the valid PK can be updated to the OS.
#   It applies to the VM with vTPM and secure boot enabled.

- name: pk_capsule_update
  hosts: localhost
  gather_facts: no
  tasks:
    - name: "Test case block"
      block:
        - name: "Test setup"
          include_tasks: ../setup/test_setup.yml
          vars:
            create_test_case_folder: true

        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: "Skip test case due to VM is not 64 bit: {{ guest_os_ansible_architecture | default('NA') }}"
            skip_reason: "Not Applicable"
          when: guest_os_ansible_architecture == "32-bit"
      
        - name: "Get the PK from the guest OS before testing"
          include_tasks: ../utils/win_execute_cmd.yml
          vars:
            win_powershell_cmd: >-
              (Get-SecureBootUEFI -Name PK -Decoded).Subject -match 'Windows OEM Devices PK'

        - name: "Verify if PK is NULL"
          ansible.builtin.assert:
            that:
              -  not win_powershell_cmd_output.failed
              -  win_powershell_cmd_output.stdout_lines[0].strip() == "False"
            fail_msg: "PK is not NULL"
      rescue:
        - name: "Test case failure"
          include_tasks: ../../common/test_rescue.yml